<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds &amp; Monsters — Join Voice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0e0f13; color:#e8e8ec; font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  .card { width:min(94vw,380px); background:#16181f; border:1px solid #262a36; border-radius:14px;
          padding:26px 24px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.02em; }
  p.sub { margin:0 0 18px; font-size:12px; line-height:1.5; color:#8b90a0; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#8b90a0; margin-bottom:6px; }
  input[type=text] { width:100%; padding:11px 12px; border-radius:8px; border:1px solid #2c313f;
          background:#0e0f13; color:#fff; font-size:15px; }
  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:8px; cursor:pointer;
          font-size:14px; font-weight:600; background:#3b82f6; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin-top:18px; font-size:12px; display:flex; align-items:center; gap:8px; color:#9aa0b0; }
  .dot { width:9px; height:9px; border-radius:50%; background:#444; flex:0 0 auto; }
  .dot.connecting { background:#f5a623; }
  .dot.connected  { background:#39d98a; }
  .dot.error, .dot.kicked { background:#e5484d; }
  .me { margin-top:14px; font-size:13px; color:#cdd2e0; display:none; }
  .me b { color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Odds &amp; Monsters — Voice</h1>
    <p class="sub">Type your name and allow your microphone. Your voice animates your character's mouth on the GM's screen. (Actual voice chat stays on Zoom — this is mouth movement only.)</p>
    <div id="setup">
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="40" placeholder="e.g. Robert" autocomplete="off">
      <button id="joinBtn">Allow microphone &amp; join</button>
    </div>
    <div class="me" id="me">Joined as <b id="meName"></b></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Not connected.</span></div>
  </div>
<script>
(function () {
  /* The join page is served by the switchboard itself, so the signaling
     socket lives on the same host — no URL to hardcode or configure. */
  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  var ICE = [
    { urls: 'stun:stun.l.google.com:19302' },
    /* §7-C TURN relay — bounces audio when a direct link isn't possible
       (different networks / strict NAT / firewalls). Open Relay by Metered;
       creds are public by design. TEST relay — swap for a dedicated one for the show. */
    { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ];

  var ws = null, pc = null, micStream = null, connId = null, joined = false;
  var pendingIce = [];   /* ICE candidates queued until the remote answer is set */
  var nameEl   = document.getElementById('name'),
      joinBtn  = document.getElementById('joinBtn'),
      setupEl  = document.getElementById('setup'),
      meEl     = document.getElementById('me'),
      meName   = document.getElementById('meName'),
      dot      = document.getElementById('dot'),
      statusTxt= document.getElementById('statusTxt');

  function setStatus(cls, txt) { dot.className = 'dot ' + (cls || ''); statusTxt.textContent = txt; }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  joinBtn.addEventListener('click', join);
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') join(); });

  async function join() {
    if (joined) return;
    var name = (nameEl.value || '').trim();
    if (!name) { nameEl.focus(); return; }
    joinBtn.disabled = true;
    setStatus('connecting', 'Requesting microphone…');
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      setStatus('error', 'Microphone blocked. Allow it in the browser and reload.');
      joinBtn.disabled = false;
      return;
    }
    joined = true;
    setupEl.style.display = 'none';
    meEl.style.display = 'block';
    meName.textContent = name;
    setStatus('connecting', 'Connecting…');
    openSocket(name);
  }

  function openSocket(name) {
    ws = new WebSocket(WS_URL);
    ws.onopen    = function () { send({ type: 'hello', role: 'player', name: name }); };
    ws.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMessage(m); };
    ws.onerror   = function () { setStatus('error', 'Connection error.'); };
    ws.onclose   = function () {
      /* Hold the seat: keep trying. The GM's screen shows "reconnecting"
         and never drops you — only a kick ends the session. */
      if (joined) { setStatus('connecting', 'Reconnecting…'); setTimeout(function () { if (joined) openSocket(name); }, 1500); }
    };
  }

  async function onMessage(m) {
    if (m.type === 'welcome') { connId = m.connId; await startPeer(); return; }
    if (m.type === 'signal')  { await onSignal(m.data); return; }
    if (m.type === 'kicked')  { leave('Removed by the GM.'); return; }
  }

  async function startPeer() {
    if (pc) { try { pc.close(); } catch (e) {} }
    pendingIce = [];
    pc = new RTCPeerConnection({ iceServers: ICE });
    micStream.getTracks().forEach(function (t) { pc.addTrack(t, micStream); });
    pc.createDataChannel('ctrl');   /* reserved for self-mute / push-to-talk status (later pass) */
    pc.onicecandidate = function (e) { if (e.candidate) send({ type: 'signal', data: { ice: e.candidate } }); };
    pc.onconnectionstatechange = function () {
      var s = pc.connectionState;
      if (s === 'connected')         setStatus('connected', 'Live — your voice is driving your character.');
      else if (s === 'failed')       setStatus('error', 'Connection failed. Reloading may help.');
      else if (s === 'disconnected') setStatus('connecting', 'Reconnecting…');
    };
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({ type: 'signal', data: { sdp: pc.localDescription } });
  }

  async function onSignal(data) {
    if (!pc) return;
    try {
      if (data.sdp) {
        await pc.setRemoteDescription(data.sdp);
        /* answer is set — flush ICE candidates that arrived before it (adding
           a candidate before the description exists throws and loses it). */
        for (var i = 0; i < pendingIce.length; i++) { try { await pc.addIceCandidate(pendingIce[i]); } catch (e) {} }
        pendingIce = [];
      } else if (data.ice) {
        if (pc.remoteDescription && pc.remoteDescription.type) { try { await pc.addIceCandidate(data.ice); } catch (e) {} }
        else { pendingIce.push(data.ice); }
      }
    } catch (e) { /* ignore malformed signaling */ }
  }

  function leave(msg) {
    joined = false;
    try { if (pc) pc.close(); } catch (e) {}
    try { if (ws) ws.close(); } catch (e) {}
    try { if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    pc = null; ws = null; micStream = null;
    setStatus('kicked', msg || 'Disconnected.');
    meEl.style.display = 'none';
  }
})();
</script>
</body>
</html>
