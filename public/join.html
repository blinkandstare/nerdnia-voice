<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds &amp; Monsters — Join Voice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0e0f13; color:#e8e8ec; font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  .card { width:min(94vw,380px); background:#16181f; border:1px solid #262a36; border-radius:14px;
          padding:26px 24px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.02em; }
  p.sub { margin:0 0 18px; font-size:12px; line-height:1.5; color:#8b90a0; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#8b90a0; margin-bottom:6px; }
  input[type=text] { width:100%; padding:11px 12px; border-radius:8px; border:1px solid #2c313f;
          background:#0e0f13; color:#fff; font-size:15px; }
  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:8px; cursor:pointer;
          font-size:14px; font-weight:600; background:#3b82f6; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin-top:18px; font-size:12px; display:flex; align-items:center; gap:8px; color:#9aa0b0; }
  .dot { width:9px; height:9px; border-radius:50%; background:#444; flex:0 0 auto; }
  .dot.connecting { background:#f5a623; }
  .dot.connected  { background:#39d98a; }
  .dot.error, .dot.kicked { background:#e5484d; }
  .me { margin-top:14px; font-size:13px; color:#cdd2e0; display:none; }
  .me b { color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Odds &amp; Monsters — Voice</h1>
    <p class="sub">Type your name and allow your microphone. Your voice animates your character's mouth on the GM's screen. (Actual voice chat stays on Zoom — this is mouth movement only.)</p>
    <div id="setup">
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="40" placeholder="e.g. Robert" autocomplete="off">
      <button id="joinBtn">Allow microphone &amp; join</button>
    </div>
    <div class="me" id="me">Joined as <b id="meName"></b></div>
    <div id="lvlWrap" style="display:none; margin-top:14px;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#8b90a0; margin-bottom:6px;">Your voice level (test)</div>
      <div style="height:12px; background:#0e0f13; border:1px solid #2c313f; border-radius:6px; overflow:hidden;">
        <div id="lvlFill" style="height:100%; width:0%; background:#39d98a;"></div>
      </div>
      <div id="lvlNum" style="font-size:11px; color:#8b90a0; margin-top:5px;">Talk — this should move.</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Not connected.</span></div>
  </div>
<script>
(function () {
  /* The join page is served by the switchboard itself, so the signaling
     socket lives on the same host — no URL to hardcode or configure. */
  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

  var ws = null, micStream = null, connId = null, joined = false;
  /* Local mic analysis — the pivot: we compute a "mouth level" here and send
     just that number over the WebSocket. No WebRTC, no audio leaves the device. */
  var audioCtx = null, analyser = null, data = null, prevBins = null, lastSent = 0;
  /* §BGFIX (2026-06-18) — the clock that drives the analysis loop is an
     AudioWorklet on the AUDIO THREAD, which browsers do NOT pause when the tab
     is backgrounded (unlike requestAnimationFrame, which the old build used and
     which froze the moment the player switched to Zoom). The worklet posts a
     metronome tick every ~16ms; the main thread reads the analyser + sends.
     rafFallbackId = the legacy rAF loop, used only if AudioWorklet is missing. */
  var workletNode = null, rafFallbackId = null, wakeLock = null, silentGain = null;
  var nameEl   = document.getElementById('name'),
      joinBtn  = document.getElementById('joinBtn'),
      setupEl  = document.getElementById('setup'),
      meEl     = document.getElementById('me'),
      meName   = document.getElementById('meName'),
      lvlWrap  = document.getElementById('lvlWrap'),
      lvlFill  = document.getElementById('lvlFill'),
      lvlNum   = document.getElementById('lvlNum'),
      dot      = document.getElementById('dot'),
      statusTxt= document.getElementById('statusTxt');

  function setStatus(cls, txt) { dot.className = 'dot ' + (cls || ''); statusTxt.textContent = txt; }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  joinBtn.addEventListener('click', join);
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') join(); });

  /* §BGFIX — when the tab/screen comes back, resume the context (mobile suspends
     it on lock) and re-take the wake lock (it's auto-released while hidden). */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (joined) requestWakeLock();
  });

  async function join() {
    if (joined) return;
    var name = (nameEl.value || '').trim();
    if (!name) { nameEl.focus(); return; }
    joinBtn.disabled = true;
    /* Create + resume the AudioContext SYNCHRONOUSLY here, inside the button
       tap. iOS Safari only honours resume() from a real user gesture; if we
       wait and do it later (in the socket callback) the context stays
       suspended and the analyser reads pure silence → level always 0. */
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) {}
    setStatus('connecting', 'Requesting microphone…');
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      setStatus('error', 'Microphone blocked. Allow it in the browser and reload.');
      joinBtn.disabled = false;
      return;
    }
    joined = true;
    /* Build the analyser graph now that we have the mic. The context is already
       resumed (above), so it reads live audio. */
    try {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;                 /* mirror the dashboard analyser */
      analyser.smoothingTimeConstant = 0.0;   /* raw frame diffs for spectral flux */
      audioCtx.createMediaStreamSource(micStream).connect(analyser);
      data = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { setStatus('error', 'Audio analysis failed. Reloading may help.'); joinBtn.disabled = false; return; }
    /* §BGFIX — start the audio-thread metronome (falls back to rAF if needed). */
    await setupMetronome();
    requestWakeLock();
    setupEl.style.display = 'none';
    meEl.style.display = 'block';
    lvlWrap.style.display = 'block';
    meName.textContent = name;
    setStatus('connecting', 'Connecting…');
    openSocket(name);
  }

  /* §BGFIX — AudioWorklet metronome. The processor lives on the audio rendering
     thread, which keeps calling process() even when the tab is in the
     background, so the analysis clock never stops. It posts a tick every ~16ms
     (matched to the old rAF cadence so the flux scale — and the dashboard's
     sensitivity calibration — is unchanged). We can't open a WebSocket from the
     worklet, so it only signals; the main-thread handler reads the analyser and
     sends. Built from a Blob URL to stay a single served file. */
  var WORKLET_SRC = [
    'class NMetro extends AudioWorkletProcessor {',
    '  constructor() { super(); this._acc = 0; }',
    '  process() {',
    '    this._acc += 128;',
    '    if (this._acc >= sampleRate * 0.016) { this._acc = 0; this.port.postMessage(0); }',
    '    return true;',   /* keep the node alive forever */
    '  }',
    '}',
    'registerProcessor("nmetro", NMetro);'
  ].join('\n');

  async function setupMetronome() {
    /* Prefer the audio-thread worklet. If anything goes wrong (older browser,
       blob/module blocked), fall back to the legacy rAF loop — no worse than
       the previous build, and foreground still works. */
    try {
      if (!audioCtx.audioWorklet) throw new Error('no audioWorklet');
      var blob = new Blob([WORKLET_SRC], { type: 'application/javascript' });
      var url  = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      workletNode = new AudioWorkletNode(audioCtx, 'nmetro');
      workletNode.port.onmessage = onTick;
      /* Pull the graph all the way to destination so process() keeps running.
         A zero-gain node = no sound out, no echo. analyser→worklet→gain0→dest. */
      silentGain = audioCtx.createGain();
      silentGain.gain.value = 0;
      analyser.connect(workletNode);
      workletNode.connect(silentGain).connect(audioCtx.destination);
    } catch (e) {
      startRafFallback();
    }
  }

  /* Legacy clock — ONLY for browsers without AudioWorklet. Pauses in background
     tabs (the bug we're fixing), but better than nothing on ancient devices. */
  function startRafFallback() {
    if (rafFallbackId) cancelAnimationFrame(rafFallbackId);
    var loop = function () { rafFallbackId = requestAnimationFrame(loop); onTick(); };
    loop();
  }

  /* One analysis step: compute spectral flux (SAME math as before and as the
     dashboard) and send a throttled mouth level. Driven by the worklet tick
     (~16ms) or the rAF fallback. */
  function onTick() {
    if (!analyser || !joined) return;
    analyser.getByteFrequencyData(data);
    var flux = 0;
    if (prevBins) {
      for (var i = 0; i < data.length; i++) { var d = data[i] - prevBins[i]; if (d > 0) flux += d; }
      flux = flux / data.length;
    } else {
      prevBins = new Uint8Array(data.length);
    }
    prevBins.set(data);
    /* On-phone test readout — proves THIS device is hearing you, independent of
       the dashboard. (sensitivity 7 = full bar.) */
    if (lvlFill) lvlFill.style.width = Math.min(100, (flux / 7) * 100) + '%';
    if (lvlNum)  lvlNum.textContent  = 'level: ' + (Math.round(flux * 10) / 10);
    /* Throttle sends to ~25/sec — plenty for discrete mouth flap frames. */
    var now = performance.now();
    if (now - lastSent >= 40) { lastSent = now; send({ type: 'mouth', level: Math.round(flux * 10) / 10 }); }
  }

  /* §BGFIX — keep the screen awake so the page isn't suspended by a display
     timeout. Best-effort: not on every browser, auto-released when hidden (we
     re-take it on visibilitychange). Does NOT defeat a manual lock or an app
     switch — those are OS-level and no web page can override them. */
  async function requestWakeLock() {
    try {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* denied / unsupported — fine */ }
  }

  function openSocket(name) {
    ws = new WebSocket(WS_URL);
    ws.onopen    = function () { send({ type: 'hello', role: 'player', name: name }); };
    ws.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMessage(m); };
    ws.onerror   = function () { setStatus('error', 'Connection error.'); };
    ws.onclose   = function () {
      /* Hold the seat: keep trying. The GM's screen shows "reconnecting"
         and never drops you — only a kick ends the session. */
      if (joined) { setStatus('connecting', 'Reconnecting…'); setTimeout(function () { if (joined) openSocket(name); }, 1500); }
    };
  }

  function onMessage(m) {
    if (m.type === 'welcome') { connId = m.connId; startMeter(); return; }
    if (m.type === 'kicked')  { leave('Removed by the GM.'); return; }
  }

  /* Mark live + ensure the context is running. The clock itself (worklet or rAF
     fallback) was started once in join(); reconnecting only re-marks status. */
  function startMeter() {
    setStatus('connected', 'Live — your voice is driving your character.');
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    prevBins = null;
    lastSent = 0;
  }

  function leave(msg) {
    joined = false;
    try { if (rafFallbackId) cancelAnimationFrame(rafFallbackId); } catch (e) {}
    try { if (workletNode) workletNode.disconnect(); } catch (e) {}
    try { if (silentGain) silentGain.disconnect(); } catch (e) {}
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    try { if (audioCtx) audioCtx.close(); } catch (e) {}
    try { if (ws) ws.close(); } catch (e) {}
    try { if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    rafFallbackId = null; workletNode = null; silentGain = null; wakeLock = null;
    audioCtx = null; analyser = null; ws = null; micStream = null;
    setStatus('kicked', msg || 'Disconnected.');
    meEl.style.display = 'none';
    lvlWrap.style.display = 'none';
  }
})();
</script>
</body>
</html>
